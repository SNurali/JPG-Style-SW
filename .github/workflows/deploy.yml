name: Deploy Trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notify deploy trigger
        run: echo "Push to main detected. Server-side deploy-watcher will pick up within 3 minutes."

      - name: Record commit
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Triggered by: ${{ github.actor }}"
